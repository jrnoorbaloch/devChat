<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Scan to log in | devChat</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f14; color: #d7dee8; font: 16px/1.6 system-ui, sans-serif; }
    main { text-align: center; padding: 24px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { color: #8b98a9; margin: 0 0 22px; }
    canvas { background: #fff; padding: 14px; border-radius: 14px; max-width: 86vw; height: auto !important; }
    .err { color: #ffcc66; }
    a { color: #3ddc97; }
  </style>
</head>
<body>
  <main>
    <h1>Scan to log in your devChat bot</h1>
    <p id="hint">Open the messenger app on the phone of the bot account and scan this code.</p>
    <canvas id="qr" aria-label="Login QR code"></canvas>
    <p style="margin-top:22px"><a href="/getting-started">devChat docs</a></p>
  </main>
  <script src="/assets/vendor/qrcode.min.js"></script>
  <script>
    // URL format: /qrcode/<encodeURIComponent(value)> (written by qrcodeValueToImageUrl()).
    // The value never leaves the browser: the code is drawn locally.
    (function () {
      var raw = location.pathname.replace(/^\/qrcode\/?/, '')
      var value = ''
      try { value = decodeURIComponent(raw) } catch (e) { value = raw }
      var hint = document.getElementById('hint')
      if (!value) {
        hint.textContent = 'No QR code value in this link. Start your bot with npm start and open the link it prints.'
        hint.className = 'err'
        return
      }
      window.QRCode.toCanvas(document.getElementById('qr'), value, { width: 320, margin: 1 }, function (err) {
        if (err) { hint.textContent = 'Could not draw this QR code: ' + err.message; hint.className = 'err' }
      })
    })()
  </script>
</body>
</html>
